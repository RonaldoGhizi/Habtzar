<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>PREVÊ Protótipo</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* Layout: palco preto com um único celular centralizado e escalado para caber na tela; o app roda dentro dele. */
    :root {
      --stage: #000000;
      --frame-a: #3a3e42;
      --frame-b: #121416;
      --bezel: #050505;
      --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --f-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--stage);
      color: #fff;
      overflow: hidden;
      font-family: var(--f-ui)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(60% 55% at 50% 52%, #071312 0%, #000 70%);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    .device {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 418px;
      height: 872px;
      margin: -436px 0 0 -209px;
      transform-origin: center center
    }

    .device .frame {
      position: absolute;
      inset: 0;
      border-radius: 66px;
      padding: 4px;
      background: linear-gradient(145deg, var(--frame-a), var(--frame-b) 40%, #2b2f33 70%, var(--frame-b));
      box-shadow: 0 40px 90px -30px rgba(61, 180, 172, .25), 0 0 0 1px #2c3033
    }

    .device .bezel {
      width: 100%;
      height: 100%;
      border-radius: 62px;
      background: var(--bezel);
      padding: 10px
    }

    .sbtn {
      position: absolute;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #2a2e31, #45494d)
    }

    .sbtn.l1 {
      left: -3px;
      top: 150px;
      height: 30px
    }

    .sbtn.l2 {
      left: -3px;
      top: 208px;
      height: 58px
    }

    .sbtn.l3 {
      left: -3px;
      top: 278px;
      height: 58px
    }

    .sbtn.r1 {
      right: -3px;
      top: 230px;
      height: 92px
    }

    /* ---------- App ---------- */
    .app {
      --bg: #F1F5F4;
      --card: #FFFFFF;
      --sunk: #E6EDEB;
      --ink: #0F2326;
      --mut: #56696B;
      --line: #D9E3E0;
      --brand: #ff8210;
      --brand-ink: #08494C;
      --brand-soft: #D4ECE9;
      --on-brand: #FFFFFF;
      --ok: #1D7A45;
      --ok-soft: #DAF0E1;
      --warn: #985A05;
      --warn-soft: #FBE8C6;
      --crit: #B3302A;
      --crit-soft: #F9DAD6;
      --toast: #0F2326;
      --on-toast: #FFFFFF;
      --flash: #B5E2DC;
      --shadow: rgba(10, 40, 40, .28);
      --glass: rgba(255, 255, 255, .97);
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 52px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      font: 15px/1.4 var(--f-ui);
      -webkit-font-smoothing: antialiased;
      user-select: none
    }

    .app.dark {
      --bg: #0A1516;
      --card: #132325;
      --sunk: #0E1C1D;
      --ink: #E4EDEB;
      --mut: #94A7A7;
      --line: #25393B;
      --brand: #3DB4AC;
      --brand-ink: #7DD4CD;
      --brand-soft: #133B3A;
      --on-brand: #062221;
      --ok: #58C487;
      --ok-soft: #11301F;
      --warn: #E6AE4C;
      --warn-soft: #362708;
      --crit: #F17C70;
      --crit-soft: #3C1714;
      --toast: #E4EDEB;
      --on-toast: #0A1516;
      --flash: #1E5552;
      --shadow: rgba(0, 0, 0, .6);
      --glass: rgba(19, 35, 37, .97)
    }

    :where(.app) button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: inherit
    }

    .app input,
    .app textarea {
      font: inherit;
      color: var(--ink);
      user-select: text
    }

    .app :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    .i {
      width: 20px;
      height: 20px;
      flex: none
    }

    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 124px;
      height: 36px;
      margin-left: -62px;
      border-radius: 20px;
      background: #000;
      z-index: 60
    }

    .sbar {
      flex: none;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 30px 0 40px;
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 5;
      background: var(--bg)
    }

    .sbar.on-brand {
      background: transparent;
      color: #fff;
      position: absolute;
      left: 0;
      right: 0;
      top: 0
    }

    .sb-r {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .sb-r .i {
      width: 18px;
      height: 18px;
      stroke-width: 2.4
    }

    .sig {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px
    }

    .sig i {
      display: block;
      width: 3px;
      border-radius: 1px;
      background: currentColor
    }

    .sig i:nth-child(1) {
      height: 4px
    }

    .sig i:nth-child(2) {
      height: 6px
    }

    .sig i:nth-child(3) {
      height: 9px
    }

    .sig i:nth-child(4) {
      height: 12px
    }

    .bat {
      width: 25px;
      height: 12px;
      border: 1.6px solid currentColor;
      border-radius: 4px;
      position: relative;
      opacity: .95
    }

    .bat::after {
      content: "";
      position: absolute;
      inset: 1.5px 6px 1.5px 1.5px;
      background: currentColor;
      border-radius: 1.5px
    }

    .sb-off {
      color: var(--crit)
    }

    .main {
      flex: 1;
      min-height: 0;
      position: relative
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg)
    }

    .view.push {
      animation: pushIn .26s ease-out
    }

    .view.pop {
      animation: popIn .22s ease-out
    }

    @keyframes pushIn {
      from {
        transform: translateX(36px);
        opacity: .3
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes popIn {
      from {
        transform: translateX(-24px);
        opacity: .4
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding: 4px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .scroll::-webkit-scrollbar {
      display: none
    }

    .scroll>* {
      flex-shrink: 0
    }

    .tabbar {
      flex: none;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 8px 6px 30px;
      position: relative;
      z-index: 4
    }

    .tb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--mut);
      width: 72px;
      position: relative
    }

    .tb .i {
      width: 24px;
      height: 24px
    }

    .tb.on {
      color: var(--brand-ink)
    }

    .tb-fab {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--brand);
      color: var(--on-brand);
      display: grid;
      place-items: center;
      margin-top: -26px;
      box-shadow: 0 8px 18px -8px var(--shadow)
    }

    .tb-fab .i {
      width: 28px;
      height: 28px;
      stroke-width: 2.6
    }

    .tb-badge {
      position: absolute;
      top: -4px;
      left: calc(50% + 6px);
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--crit);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
      padding: 0 5px
    }

    .home-ind {
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 136px;
      height: 5px;
      margin-left: -68px;
      border-radius: 3px;
      background: var(--ink);
      opacity: .85;
      z-index: 50;
      pointer-events: none
    }

    /* cabeçalhos */
    .hd {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 16px 10px
    }

    .hd h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1
    }

    .hd p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--mut)
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand-ink);
      font-weight: 800;
      font-size: 16px;
      display: grid;
      place-items: center;
      flex: none;
      position: relative
    }

    .avatar small {
      position: absolute;
      bottom: -2px;
      right: -4px;
      font-size: 8.5px;
      background: var(--brand);
      color: var(--on-brand);
      border-radius: 6px;
      padding: 1px 4px;
      font-weight: 800;
      letter-spacing: .02em
    }

    .bh {
      flex: none;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 4px 10px 8px;
      gap: 6px
    }

    .back {
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--brand-ink);
      font-weight: 700;
      font-size: 15px;
      min-height: 40px;
      justify-self: start
    }

    .bh-t {
      font-weight: 800;
      font-size: 16px;
      text-align: center
    }

    .bh-r {
      justify-self: end
    }

    /* blocos */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .card.list {
      gap: 0;
      padding-bottom: 6px
    }

    .card.hrow {
      flex-direction: row;
      align-items: flex-start;
      gap: 12px;
      text-align: left
    }

    .card.hrow>.i {
      color: var(--brand-ink);
      margin-top: 2px
    }

    button.card {
      width: 100%
    }

    .lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--mut)
    }

    .num {
      font-weight: 800;
      font-size: 27px;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.015em;
      white-space: nowrap
    }

    .num.s {
      font-size: 20px;
      line-height: 1.4
    }

    .fc {
      color: var(--brand-ink);
      text-decoration: underline dashed var(--brand) 2px;
      text-underline-offset: 5px
    }

    .sub {
      font-size: 12.5px;
      color: var(--mut);
      line-height: 1.35
    }

    .hl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .hl3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px
    }

    .foot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 12.5px;
      color: var(--mut);
      font-variant-numeric: tabular-nums
    }

    .foot-row b {
      color: var(--ink)
    }

    .up {
      color: var(--ok);
      font-weight: 700
    }

    .dn {
      color: var(--crit);
      font-weight: 700
    }

    .sec-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
      font-size: 15px
    }

    .card.list>.sec-h {
      margin-bottom: 6px
    }

    .sec-n {
      font-weight: 600;
      font-size: 12px;
      color: var(--mut)
    }

    .sec-t {
      font: 500 11px var(--f-mono);
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--mut);
      padding: 6px 4px 0
    }

    .demo {
      flex: none;
      font: 500 10px/1 var(--f-mono);
      letter-spacing: .1em;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 6px;
      color: var(--mut)
    }

    .lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--mut)
    }

    .lock .i {
      width: 15px;
      height: 15px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      font-size: 12px;
      line-height: 1;
      padding: 5px 9px 5px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex: none
    }

    .chip .i {
      width: 13px;
      height: 13px;
      stroke-width: 2.6
    }

    .chip.xs {
      font-size: 11px;
      padding: 4px 7px 4px 5px
    }

    .chip.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .chip.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .chip.crit {
      background: var(--crit-soft);
      color: var(--crit)
    }

    .chip.brand {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .chip.neutral {
      background: var(--sunk);
      color: var(--mut)
    }

    .rec {
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line)
    }

    .rec.crit {
      background: var(--crit-soft);
      border-color: transparent
    }

    .rec.warn {
      background: var(--warn-soft);
      border-color: transparent
    }

    .rec.brand {
      background: var(--brand-soft);
      border-color: transparent
    }

    .rec-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .rec-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: 500 10.5px var(--f-mono);
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .rec-tag .i {
      width: 15px;
      height: 15px;
      color: var(--brand-ink);
      stroke-width: 2.8
    }

    .rec h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.25;
      text-wrap: balance
    }

    .rec p {
      margin: 0;
      font-size: 14px
    }

    .acts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px
    }

    .btn {
      font-weight: 800;
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent
    }

    .btn .i {
      width: 17px;
      height: 17px
    }

    .app .btn.pri {
      background: var(--brand);
      color: var(--on-brand)
    }

    .app .btn.sec {
      background: var(--card);
      border-color: var(--line)
    }

    .app .btn.ghost {
      color: var(--brand-ink);
      padding-inline: 4px
    }

    .app .btn.big {
      width: 100%;
      min-height: 52px;
      font-size: 16px
    }

    .app .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .app .btn:not(:disabled):active {
      transform: scale(.98)
    }

    .four dl {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 9px 10px;
      margin: 2px 0 0;
      font-size: 14px
    }

    .four dt {
      font: 500 10.5px/1.6 var(--f-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      padding-top: 1px
    }

    .four dd {
      margin: 0
    }

    .fb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding-top: 2px
    }

    .app .fb button {
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 700;
      font-size: 12.5px
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      width: 100%;
      font-size: 14.5px;
      text-align: left
    }

    .row .grow {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    .row .grow b {
      font-weight: 700
    }

    .rq {
      color: var(--mut);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      white-space: nowrap
    }

    .chv {
      width: 17px;
      height: 17px;
      color: var(--mut)
    }

    .mdot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: none
    }

    .mdot .i {
      width: 15px;
      height: 15px;
      stroke-width: 2.6
    }

    .mdot.crit {
      background: var(--crit-soft);
      color: var(--crit)
    }

    .mdot.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .mdot.brand {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .mdot.neutral {
      background: var(--sunk);
      color: var(--mut)
    }

    .mdot.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      flex: none;
      display: block
    }

    .ini {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--sunk);
      color: var(--mut);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      flex: none
    }

    .prow {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 0 6px;
      border-top: 1px solid var(--line);
      width: 100%;
      text-align: left
    }

    .prow-h {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .prow-h .thumb {
      width: 36px;
      height: 36px;
      border-radius: 10px
    }

    .pname {
      flex: 1;
      font-weight: 700;
      min-width: 0;
      font-size: 14.5px
    }

    .pnum {
      font-variant-numeric: tabular-nums;
      color: var(--mut);
      font-size: 13px;
      white-space: nowrap
    }

    .pnum b {
      color: var(--ink)
    }

    .rbar {
      position: relative;
      height: 18px;
      margin: 2px 0 0
    }

    .rbar::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 2px;
      background: var(--line);
      border-radius: 2px
    }

    .rb-s {
      position: absolute;
      left: 0;
      top: 3px;
      height: 12px;
      background: var(--brand);
      border-radius: 6px 0 0 6px
    }

    .rb-d {
      position: absolute;
      top: 3px;
      height: 12px;
      border: 1.8px dashed var(--brand);
      border-left: 0;
      border-radius: 0 6px 6px 0;
      background: var(--card)
    }

    .rb-m {
      position: absolute;
      top: 0;
      width: 2.5px;
      height: 18px;
      background: var(--ink);
      border-radius: 1px;
      transform: translateX(-1px)
    }

    .legend {
      display: flex;
      gap: 4px 14px;
      font-size: 12px;
      color: var(--mut);
      flex-wrap: wrap
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .legend i {
      display: inline-block;
      width: 16px;
      height: 9px;
      border-radius: 2px
    }

    .lg-s {
      background: var(--brand)
    }

    .lg-d {
      border: 1.6px dashed var(--brand)
    }

    .lg-m {
      width: 2.5px !important;
      height: 13px !important;
      background: var(--ink)
    }

    .lg-x {
      background: repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 4px)
    }

    .hchart {
      width: 100%;
      height: auto;
      display: block
    }

    .hchart .c-s {
      fill: var(--brand)
    }

    .hchart .c-d {
      fill: none;
      stroke: var(--brand);
      stroke-width: 1.6;
      stroke-dasharray: 3.5 2.5
    }

    .hchart .c-base {
      stroke: var(--line);
      stroke-width: 1
    }

    .hchart .c-now {
      stroke: var(--ink);
      stroke-width: 1.3;
      stroke-dasharray: 2 2
    }

    .hchart text {
      font-family: var(--f-ui);
      font-size: 11px
    }

    .hchart .c-t,
    .hchart .c-p {
      fill: var(--mut)
    }

    .hchart .c-v {
      fill: var(--ink);
      font-weight: 800
    }

    .hchart .c-nl {
      fill: var(--ink);
      font-weight: 700
    }

    .fx {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: 14px
    }

    .fx b {
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .fx.mut {
      color: var(--mut)
    }

    .fx.tot {
      font-weight: 800
    }

    .conf {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      background: var(--sunk);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      margin-top: 6px
    }

    .conf .i {
      width: 17px;
      height: 17px;
      color: var(--warn);
      margin-top: 1px
    }

    .tl {
      display: grid;
      grid-template-columns: 62px 9px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      padding: 9px 0;
      font-size: 13.5px;
      border-top: 1px solid var(--line)
    }

    .tl-t {
      color: var(--mut);
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 12.5px
    }

    .tl-d {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--line);
      margin-top: 5px
    }

    .tl.new .tl-d {
      background: var(--brand)
    }

    .tl.new .tl-t {
      color: var(--brand-ink);
      font-weight: 700
    }

    .sbar2 {
      position: relative;
      height: 20px;
      margin: 4px 0 2px
    }

    .sb-need {
      position: absolute;
      left: 0;
      top: 0;
      height: 20px;
      border: 1.8px dashed var(--brand);
      border-radius: 8px
    }

    .sb-stock {
      position: absolute;
      left: 0;
      top: 4px;
      height: 12px;
      background: var(--brand);
      border-radius: 5px
    }

    .sb-gap {
      position: absolute;
      top: 4px;
      height: 12px;
      background: repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 4px);
      border-radius: 0 5px 5px 0
    }

    .ihead {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 14.5px;
      padding-top: 2px
    }

    .ihead .i {
      width: 18px;
      height: 18px;
      margin-top: 1px
    }

    .ihead.crit {
      color: var(--crit)
    }

    .ihead.warn {
      color: var(--warn)
    }

    .ihead.ok {
      color: var(--ok)
    }

    .ihead span {
      color: var(--mut)
    }

    .days {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
      height: 116px
    }

    .dcol {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      height: 100%;
      font-size: 12px
    }

    .dbar {
      width: 100%;
      border: 1.6px dashed var(--brand);
      border-bottom-style: solid;
      border-radius: 6px 6px 0 0;
      background: var(--brand-soft)
    }

    .dv {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 12px
    }

    .dv.mut {
      font-weight: 500;
      color: var(--mut);
      font-size: 11px
    }

    .dd {
      color: var(--mut)
    }

    .actbar {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: var(--card);
      border-top: 1px solid var(--line)
    }

    .app .actbar .btn {
      flex: 1;
      background: var(--sunk);
      font-size: 13.5px;
      min-height: 42px;
      padding: 8px 6px
    }

    /* imagens de produto */
    .art {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden
    }

    .art svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    /* Vender */
    .seg {
      display: flex;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      flex: none
    }

    .app .segb {
      flex: 1;
      padding: 9px 4px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--mut);
      text-align: center
    }

    .app .segb.on {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .cat {
      font: 500 11px var(--f-mono);
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--mut);
      margin: 2px 2px -4px
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .app .tile {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px 6px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      transition: transform .08s
    }

    .app .tile:active {
      transform: scale(.96)
    }

    .tile .ti {
      display: block;
      aspect-ratio: 1;
      border-radius: 11px;
      overflow: hidden;
      max-width: 100%
    }

    .tile .tn {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.2;
      padding: 0 3px;
      min-height: 31px
    }

    .tile .tp {
      font-size: 12.5px;
      color: var(--mut);
      font-variant-numeric: tabular-nums;
      padding: 0 3px
    }

    .tile .bdg {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 26px;
      height: 26px;
      border-radius: 13px;
      background: var(--brand);
      color: var(--on-brand);
      font-weight: 800;
      font-size: 13.5px;
      display: grid;
      place-items: center;
      padding: 0 7px;
      box-shadow: 0 0 0 3px var(--card)
    }

    .tile .rib {
      position: absolute;
      left: 10px;
      top: 10px;
      background: var(--warn);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      border-radius: 6px;
      padding: 3px 6px
    }

    .tile.paused {
      opacity: .45
    }

    .tile.paused .rib {
      background: var(--mut)
    }

    .cart {
      flex: none;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 10px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 -10px 20px -18px var(--shadow)
    }

    .cart-lines {
      max-height: 98px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: none
    }

    .cl {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 76px;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-variant-numeric: tabular-nums
    }

    .cl-v {
      text-align: right;
      font-weight: 700
    }

    .stp {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .app .stp button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--sunk);
      font-weight: 800;
      font-size: 16px;
      display: grid;
      place-items: center;
      text-align: center
    }

    .stp b {
      min-width: 14px;
      text-align: center
    }

    .banner {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--warn-soft);
      color: var(--warn);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13.5px;
      font-weight: 700;
      flex: none
    }

    .banner .i {
      width: 18px;
      height: 18px
    }

    /* Compras */
    .grp {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden
    }

    .grp-h {
      font: 500 11px var(--f-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mut);
      padding: 12px 14px 6px;
      display: flex;
      justify-content: space-between
    }

    .grp.urg {
      border-color: var(--crit)
    }

    .grp.urg .grp-h {
      color: var(--crit)
    }

    .app .buy {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      width: 100%
    }

    .cb {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--mut);
      display: grid;
      place-items: center
    }

    .cb .i {
      width: 16px;
      height: 16px;
      stroke-width: 3
    }

    .buy.done .cb {
      background: var(--ok);
      border-color: var(--ok);
      color: var(--card)
    }

    .bn {
      display: block;
      font-weight: 700;
      font-size: 14.5px
    }

    .bs {
      display: block;
      font-size: 12px;
      color: var(--mut);
      line-height: 1.3
    }

    .bq {
      text-align: right;
      font-weight: 800;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .bq small {
      display: block;
      font-weight: 500;
      font-size: 11.5px;
      color: var(--mut)
    }

    .buy.done .bn,
    .buy.done .bq {
      color: var(--mut)
    }

    .sticky-foot {
      flex: none;
      padding: 10px 16px 12px;
      background: var(--card);
      border-top: 1px solid var(--line)
    }

    /* Produção: fila de pedidos */
    .ord {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .ord.next {
      border: 2px solid var(--brand);
      padding: 13px
    }

    .ord.prep {
      background: var(--brand-soft);
      border-color: transparent
    }

    .ord-h {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .ord-h .grow {
      flex: 1;
      min-width: 0
    }

    .ord-pos {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--sunk);
      color: var(--mut);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      flex: none
    }

    .ord.next .ord-pos {
      background: var(--brand);
      color: var(--on-brand)
    }

    .ord.prep .ord-pos {
      background: var(--card);
      color: var(--brand-ink)
    }

    .ord.ready .ord-pos {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .ord-n {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.15
    }

    .ord-meta {
      font-size: 12.5px;
      color: var(--mut)
    }

    .ord-t {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--mut)
    }

    .ord-t .i {
      width: 15px;
      height: 15px
    }

    .ord-t.warn {
      color: var(--warn)
    }

    .ord-t.crit {
      color: var(--crit)
    }

    .ord-items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .ord-items li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700
    }

    .ord-items .qn {
      min-width: 38px;
      height: 32px;
      border-radius: 9px;
      background: var(--sunk);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums
    }

    .ord.prep .ord-items .qn {
      background: var(--card)
    }

    .ord-items .thumb {
      width: 36px;
      height: 36px;
      border-radius: 10px
    }

    .ord-drk {
      font-size: 12.5px;
      color: var(--mut)
    }

    .app .ord .btn {
      width: 100%
    }

    .banner.ok {
      background: var(--ok-soft);
      color: var(--ok);
      width: 100%
    }

    /* Simulação da semana */
    .sim-cta {
      background: var(--brand-soft) !important;
      border-color: transparent !important;
      align-items: center !important
    }

    .sim-cta>.i {
      color: var(--brand-ink)
    }

    .app .dayrow {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 64px;
      column-gap: 10px;
      row-gap: 3px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      width: 100%;
      text-align: left
    }

    .dr-d {
      grid-row: 1/3;
      display: flex;
      flex-direction: column;
      line-height: 1.15
    }

    .dr-d b {
      font-size: 14.5px
    }

    .dr-d small {
      font-size: 11.5px;
      color: var(--mut);
      font-variant-numeric: tabular-nums
    }

    .dr-bar {
      height: 14px;
      position: relative
    }

    .dr-bar span {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border: 1.6px dashed var(--brand);
      background: var(--brand-soft);
      border-radius: 5px
    }

    .dr-bar.hi span {
      background: var(--flash)
    }

    .dr-bar.adj span {
      border-color: var(--warn);
      background: var(--warn-soft)
    }

    .dr-n {
      text-align: right;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 14.5px;
      line-height: 1.1
    }

    .dr-n small {
      display: block;
      font-weight: 500;
      font-size: 10.5px;
      color: var(--mut)
    }

    .dr-note {
      grid-column: 2/4;
      font-size: 11.5px;
      color: var(--mut);
      line-height: 1.25
    }

    .dr-note.hi {
      color: var(--brand-ink);
      font-weight: 700
    }

    .dr-note.adj {
      color: var(--warn);
      font-weight: 700
    }

    .dayrow.closed {
      opacity: .55
    }

    .card.list>.sec-h>.i {
      align-self: center;
      color: var(--brand-ink);
      width: 18px;
      height: 18px
    }

    .sim-sec {
      font: 500 10.5px var(--f-mono);
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--mut);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 0 4px;
      border-top: 1px solid var(--line);
      margin-top: 4px
    }

    .dlt {
      display: inline-block;
      margin-left: 6px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-ink);
      background: var(--brand-soft);
      border-radius: 6px;
      padding: 1px 5px;
      vertical-align: 1px
    }

    .dlt.dn {
      color: var(--mut);
      background: var(--sunk)
    }

    /* Agenda do mercado */
    .wk {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px
    }

    .app .wkd {
      min-height: 44px;
      border-radius: 11px;
      border: 1.5px solid var(--line);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
      color: var(--mut);
      text-align: center
    }

    .app .wkd.on {
      background: var(--brand);
      border-color: var(--brand);
      color: var(--on-brand)
    }

    .wkd .i {
      width: 14px;
      height: 14px;
      stroke-width: 2.6
    }

    .strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      column-gap: 3px;
      row-gap: 5px
    }

    .app .sd {
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 3px 0 5px;
      border-radius: 10px;
      font-size: 10.5px;
      color: var(--mut);
      line-height: 1.15;
      text-align: center
    }

    .sd b {
      font-size: 15px;
      color: var(--ink);
      font-variant-numeric: tabular-nums
    }

    .sd-ic {
      height: 18px;
      display: grid;
      place-items: center
    }

    .sd-ic .i {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
      color: var(--brand-ink)
    }

    .sd.closed b {
      color: var(--mut);
      font-weight: 600
    }

    .app .sd.sel {
      background: var(--brand-soft)
    }

    .sd.today {
      color: var(--brand-ink);
      font-weight: 700
    }

    .sd.today .sd-ic .i {
      color: var(--mut)
    }

    .cov {
      grid-row: 2;
      height: 20px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 4px
    }

    .cov.stock {
      background: var(--sunk);
      color: var(--mut)
    }

    .cov.gap {
      background: var(--crit-soft);
      color: var(--crit);
      border: 1.5px dashed var(--crit)
    }

    .cov.trip {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .cov.trip.sel {
      background: var(--brand);
      color: var(--on-brand)
    }

    .app .segb small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--mut)
    }

    .app .segb.on small {
      color: var(--brand-ink)
    }

    .trip-h {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.25
    }

    /* Mais, listas */
    .menu {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden
    }

    .app .mi {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-top: 1px solid var(--line);
      font-size: 15px;
      font-weight: 600;
      width: 100%
    }

    .mi:first-child {
      border-top: 0
    }

    .mi .ic {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--sunk);
      display: grid;
      place-items: center;
      color: var(--brand-ink);
      flex: none
    }

    .mi .ic .i {
      width: 18px;
      height: 18px
    }

    .mi .grow {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .mi .grow small {
      font-weight: 500;
      font-size: 12.5px;
      color: var(--mut)
    }

    .switch {
      width: 44px;
      height: 26px;
      border-radius: 13px;
      background: var(--line);
      position: relative;
      flex: none;
      transition: background .15s
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;

            render(); if (part) toast(bx.g.nome + ' marcado como completo: ' + qk(bx.qty, bx.g) + '. Para dizer quanto pegou, use o Modo mercado.'); break;
          }
          case 'regBuy': { var r = regBuy(null); render(); toast(regToast(r), true); break; }
          case 'mercado': { var list = mkItems().map(function (x) { return x.key; }); S.mkt = { i: 0, list: list }; renderOverlay(); break; }
          case 'mkStep': { var cx = mkCur(); if (!cx) break; var stp = mkStepOf(cx.g); S.mkt.cur = Math.max(0, r6((+v > 0 ? Math.floor(r6(S.mkt.cur / stp) + 1e-9) + 1 : Math.ceil(r6(S.mkt.cur / stp) - 1e-9) - 1) * stp)); renderOverlay(); break; }
          case 'mkSet': { var cs = mkCur(); if (!cs) break; S.mkt.cur = v === 'all' ? cs.qty : 0; renderOverlay(); break; }
          case 'mkGot': { var m = S.mkt, k = m.list[m.i], c = Math.max(0, r6(m.cur || 0)); S.got[k] = c; var bi = S.bought.indexOf(k); if (c > 0 && bi < 0) S.bought.push(k); if (c <= 0 && bi >= 0) S.bought.splice(bi, 1); m.i = m.ret ? m.list.length : m.i + 1; m.ret = false; m.curK = null; renderOverlay(); break; }
          case 'mkSkip': S.mkt.i = S.mkt.ret ? S.mkt.list.length : S.mkt.i + 1; S.mkt.ret = false; S.mkt.curK = null; renderOverlay(); break;
          case 'mkPrev': S.mkt.i = Math.max(0, S.mkt.i - 1); S.mkt.ret = false; S.mkt.curK = null; renderOverlay(); break;
          case 'mkGo': S.mkt.i = +v; S.mkt.ret = true; S.mkt.curK = null; renderOverlay(); break;
          case 'mkClose': S.mkt = null; render(); break;
          case 'mkReg': { var r2 = regBuy(S.mkt.list.slice()); S.mkt = null; render(); toast(regToast(r2), true); break; }
          case 'defer': {
            var sd = S.short[v]; if (!sd) break; S.defer[v] = true; render(); var pd = plan(compute(S)), td = pd.trips.filter(function (t) { return t.iso === sd.iso; })[0], nd = td && td.next, rd = td ? runOut(sd.id, td, 0) : {};
            toast(cap(ING[sd.id].curto) + ' fica para ' + (nd ? WD[nd.w] + ' ' + nd.dm : 'a próxima ida') + '.' + (rd.day ? ' Atenção: falta ' + PREP[rd.day.w] + ' ' + WDL[rd.day.w] + '.' : '')); break;
          }
          case 'undefer': delete S.defer[v]; render(); toast('O que faltou voltou para a lista desta ida.'); break;
          case 'copyWa': copyText(whatsText(), 'Lista copiada. É só colar no WhatsApp.', document.getElementById('waText')); break;
          case 'copy': copyText(v, 'Convite copiado.'); break;
          case 'conviteRole': S.sheet.r = v; renderSheet(); break;
          case 'mov': { var gg = ING[w]; S.sheet = { t: 'mov', kind: v, id: w, q: v === 'contagem' ? S.stock[w] : (v === 'entrada' ? (gg.un === 'kg' ? 1 : gg.pack) : (gg.un === 'kg' ? .1 : 1)), reason: 'Estragou' }; renderSheet(); break; }
          case 'movStep': { var sh = S.sheet, gm = ING[sh.id], step = gm.un === 'kg' ? .1 : 1; sh.q = v === 'pack' ? r6(sh.q + gm.pack) : Math.max(0, r6(sh.q + step * (+v))); renderSheet(); break; }
          case 'movReason': S.sheet.reason = v; renderSheet(); break;
          case 'movSave': {
            var s2 = S.sheet, g2 = ING[s2.id], qv = r6(s2.q), before = S.stock[s2.id];
            if (s2.kind !== 'contagem' && !(qv > 0)) { toast('Informe uma quantidade maior que zero.'); break; }
            hist.push(snapshot());
            if (s2.kind === 'entrada') { S.stock[s2.id] = r6(before + qv); S.spent += qv * g2.preco; addMove(s2.id, 'Entrada +' + qb(qv, g2) + ' · ' + me().nome); }
            else if (s2.kind === 'perda') { S.stock[s2.id] = Math.max(0, r6(before - qv)); addMove(s2.id, 'Perda −' + qb(qv, g2) + ' · ' + s2.reason + ' · ' + me().nome); }
            else { var df = r6(qv - before); S.stock[s2.id] = qv; addMove(s2.id, 'Contagem: ' + qb(qv, g2) + ' · ajuste ' + (df >= 0 ? '+' : '−') + qb(Math.abs(df), g2) + ' · ' + me().nome); }
            S.sheet = null; checkAlerts(); render(); toast({ entrada: 'Entrada registrada.', perda: 'Perda registrada.', contagem: 'Contagem registrada.' }[s2.kind] + ' A previsão já usa o novo estoque.', true); break;
          }
          case 'pause': { var pi = S.paused.indexOf(v); if (pi < 0) { S.paused.push(v); toast(PBY[v].nome + ' saiu da tela Vender.'); } else { S.paused.splice(pi, 1); toast(PBY[v].nome + ' voltou para a tela Vender.'); } render(); break; }
          case 'foto': S.sheet = { t: 'foto', id: v }; renderSheet(); break;
          case 'pickFoto': S.fotoPid = v; document.getElementById('fileIn').click(); break;
          case 'fotoRemove': removePhoto(v); break;
          case 'evImpact': S.sheet.impacto = v; renderSheet(); break;
          case 'evSave': { var ev = S.sheet; if (!ev.nome || !ev.nome.trim()) break; S.events.push({ date: ev.date || '2026-11-21', nome: ev.nome.trim().slice(0, 60), tipo: 'Evento local', impacto: ev.impacto && ev.impacto !== 'Não sei' ? ev.impacto : '', local: true }); S.sheet = null; render(); toast('Evento salvo no calendário.'); break; }
          case 'feriado': S.feriado = v; render(); break;
          case 'pico': pico(); break;
          case 'offline': setOffline(!S.offline); break;
          case 'dark': S.mode = S.mode === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('preve-modo', S.mode); } catch (err) { } render(); break;
          case 'reset': reset(); break;
          case 'notifOpen': document.getElementById('notif').hidden = true; if (w && S.user) { setTab(w); } else if (S.user && (role() === 'dono' || role() === 'gerente')) { S.tab = 'hoje'; S.stack = [{ s: 'ing', id: v }]; S.sheet = null; S.mkt = null; S.anim = 'push'; render(); } break;
        }
      });
      app.addEventListener('input', function (e) {
        var t = e.target;
        if (t.id === 'movQ' && S.sheet) {
          S.sheet.q = Math.max(0, parseFloat(String(t.value).replace(',', '.')) || 0);
          var g = ING[S.sheet.id], stock = S.stock[S.sheet.id], el = document.getElementById('movPrev'), k = S.sheet.kind;
          if (el) {
            if (k === 'contagem') { var df = r6(S.sheet.q - stock); el.textContent = 'Ajuste: ' + (df >= 0 ? '+' : '−') + qs(Math.abs(df), g) + (g.un === 'kg' ? '' : ' ' + g.un); }
            else if (k === 'entrada') el.textContent = 'Fica com ' + q(r6(stock + S.sheet.q), g).replace(/ /g, ' ');
            else el.textContent = 'Fica com ' + q(Math.max(0, r6(stock - S.sheet.q)), g).replace(/ /g, ' ');
          }
        }
        if (t.id === 'mkQ' && S.mkt) { S.mkt.cur = Math.min(9999, Math.max(0, parseFloat(String(t.value).replace(',', '.')) || 0)); var cx = mkCur(); if (cx) mkSync(cx); }
        if (t.id === 'evName' && S.sheet) { S.sheet.nome = t.value; var bt = document.getElementById('evSaveBtn'); if (bt) bt.disabled = !t.value.trim(); }
        if (t.id === 'evDate' && S.sheet) { S.sheet.date = t.value; }
      });
      document.addEventListener('keydown', function (e) {
        if (e.target && e.target.id === 'mkQ' && e.key === 'Enter') { var okb = document.getElementById('mkOk'); if (okb) okb.click(); return; }
        if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var k = e.key;
        if (k === 'Escape') { if (S.mkt) { S.mkt = null; render(); } else if (S.sheet) { S.sheet = null; renderSheet(); } else if (S.stack.length) { S.stack.pop(); S.anim = 'pop'; render(); } return; }
        if (!S.user && !/[1234]/.test(k)) return;
        if (k === '1') login('doca'); else if (k === '2') login('bia'); else if (k === '3') login('lucas'); else if (k === '4') login('rafa');
        else if (k === 'p' || k === 'P') pico(); else if (k === 'o' || k === 'O') setOffline(!S.offline);
      });

      /* ================= Escala do aparelho ================= */
      function fit() {
        var dv = document.getElementById('device'), W = 418 + 24, H = 872 + 32;
        var s = Math.max(.3, Math.min(1.3, (window.innerHeight - 24) / H, (window.innerWidth - 24) / W));
        dv.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit); fit();
      /* Relógio de espera dos pedidos: atualiza só os textos, sem redesenhar a tela. */
      setInterval(function () {
        document.querySelectorAll('#app [data-at]').forEach(function (el) {
          var t = +el.dataset.at, sp = el.querySelector('span');
          if (sp) sp.textContent = agoTxt(t); else el.textContent = agoTxt(t);
          if (el.dataset.sla) el.className = 'ord-t' + slaCls(t);
        });
      }, 15000);
      render();
    })();
